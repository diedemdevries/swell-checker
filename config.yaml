# ============================================================
#  SURF CHECK — alle instellingen staan hier.
#  Je hoeft nooit in de Python-code te duiken om iets te wijzigen.
#
#  OPBOUW
#  - regions : een groep vliegvelden die samen een surfgebied bedienen.
#              Het script zoekt binnen de hele pool en kiest de beste
#              combinatie van prijs en rijtijd.
#  - spots   : elke spot hangt aan een regio en heeft per vliegveld een
#              rijtijd in minuten. Staat een vliegveld er niet bij, dan
#              telt het niet mee voor die spot.
#
#  BELANGRIJKSTE GETALLEN PER SPOT
#    faces        welke kant de golf op kijkt (graden). Hieruit volgt wat
#                 offshore is: wind uit (faces + 180).
#    swell_window uit welke richtingen deining er daadwerkelijk in komt.
#    size_factor  hoe hard de bodem de deining opblaast.
#                 ~1.0 flauw strand · ~1.5 point · ~1.7 zware reef
#    season       maanden waarin we uberhaupt scannen (scheelt ruis)
#    tier         near = 2 goede dagen genoeg, far = 3
# ============================================================

criteria:
  min_surf_ft: 5.0
  max_surf_ft: 12.0
  min_period_s: 8.0
  ideal_period_s: 14.0
  max_wind_kt: 10.0
  max_wind_kt_offshore: 15.0
  offshore_tolerance_deg: 50
  morning_start_h: 6
  morning_end_h: 11
  min_good_hours: 3
  weights:
    size: 0.3
    period: 0.35
    wind: 0.25
    direction: 0.1
  min_day_score: 55

trip:
  people: 2
  max_stay_eur_night: 50
  flight_reference_eur: 200
  flex_days_before: 2
  flex_days_after: 2
  max_trip_nights: 6
  early_warning_days:
