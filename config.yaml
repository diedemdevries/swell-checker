# ============================================================
#  HUURAUTO — schatting per bestemming, euro per dag, kleinste klasse.
#  Dit is een RICHTPRIJS voor de begroting in het voorstel; de echte
#  prijs komt uit de zoeklink. Pas aan zodra je ziet wat je echt betaalt.
# ============================================================
car_eur_day:
  AGA: 15
  LIS: 25
  FAO: 22
  BIO: 40
  SDR: 38
  OVD: 38
  BIQ: 45
  BOD: 42
  NQY: 40
  BRS: 38
  SNN: 35
  NOC: 32

# Naam van de stad die we in de hostel- en autolinks gebruiken
airport_city:
  AGA: Agadir
  LIS: Lisbon
  FAO: Faro
  BIO: Bilbao
  SDR: Santander
  OVD: Oviedo
  BIQ: Biarritz
  BOD: Bordeaux
  NQY: Newquay
  BRS: Bristol
  SNN: Shannon
  NOC: Knock

# ============================================================
#  ZOEKLINKS
#  Deze staan hier zodat je ze kunt bijstellen zonder in de code te duiken.
#  Placeholders: {ORIGIN} {DEST} (hoofdletters IATA), {origin} {dest}
#  (kleine letters), {out} {back} (JJJJ-MM-DD), {out_short} {back_short}
#  (JJMMDD), {city}, {people}, {maxprice}, {AIRPORT}
# ============================================================
links:
  # Skyscanner pakt ook Transavia en Wizz mee, dus dit is de controlelink
  # naast de Ryanair-prijs die het script zelf ophaalt.
  flight: "https://www.skyscanner.nl/transport/vluchten/{origin}/{dest}/{out_short}/{back_short}/?adults={people}"
  car: "https://www.kayak.nl/cars/{AIRPORT}/{out}/{back}"
  stay: "https://www.booking.com/searchresults.html?ss={city}&checkin={out}&checkout={back}&group_adults={people}&nflt=price%3DEUR-min-{maxprice}-1"
