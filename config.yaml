# ============================================================
#  SURF CHECK — alle instellingen staan hier.
#  Je hoeft nooit in de Python-code te duiken om iets te wijzigen.
# ============================================================

criteria:
  # --- Golven ---
  min_surf_ft: 5.0        # ondergrens brekende golf
  max_surf_ft: 12.0       # daarboven is het geen sessie meer
  min_period_s: 8.0       # harde ondergrens (jouw keuze)
  ideal_period_s: 14.0    # hier krijgt de score de volle punten

  # --- Wind ---
  max_wind_kt: 10.0           # uit elke richting
  max_wind_kt_offshore: 15.0  # mag harder mits offshore
  offshore_tolerance_deg: 50  # hoeveel graden van pal-offshore telt nog als offshore

  # --- Ochtendvenster (lokale tijd) ---
  # De thermische zeewind trekt bijna overal rond 11u aan, dus daarbuiten
  # zoeken heeft geen zin. Een dag telt mee als er hierbinnen genoeg
  # goede uren zitten.
  morning_start_h: 6
  morning_end_h: 11
  min_good_hours: 3       # aaneengesloten goede uren binnen dat venster

  # --- Score-weging (moet optellen tot 1.0) ---
  # Periode weegt het zwaarst: dat scheidt echte grondzwelling van windrommel.
  weights:
    size: 0.30
    period: 0.35
    wind: 0.25
    direction: 0.10

  min_day_score: 55       # een dag onder deze score telt niet mee als 'goede dag'

trip:
  max_flight_eur: 200         # retour per persoon
  max_hostel_eur_night: 50    # per persoon
  people: 2
  early_warning_days: [6, 9]  # niveau 1: swell zit nog zo ver weg
  confirm_days: [0, 5]        # niveau 2: binnen dit venster is het serieus
  max_trip_nights: 6

# Vertrekvliegvelden, op volgorde van jouw voorkeur bij gelijke prijs
origins:
  - code: EIN
    name: Eindhoven
  - code: AMS
    name: Amsterdam
  - code: RTM
    name: Rotterdam
  - code: NRN
    name: Weeze
  - code: CRL
    name: Brussel Charleroi
  - code: BRU
    name: Brussel Zaventem

# Reistijd-categorie bepaalt hoeveel goede dagen een trip moet hebben
tiers:
  near: {min_days: 2}   # Frankrijk, Spanje, Noord-Portugal
  far:  {min_days: 3}   # Marokko, Ierland, Engeland, Algarve

