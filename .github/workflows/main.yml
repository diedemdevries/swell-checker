name: Surf check

on:
  schedule:
    # 06:10 en 18:10 UTC. Twee keer per dag is genoeg: golfmodellen
    # draaien maar een paar keer per etmaal, vaker checken levert niets op.
    - cron: "10 6,18 * * *"
  workflow_dispatch:        # knop in de Actions-tab om handmatig te draaien
    inputs:
      dry_run:
        description: "Alles doorrekenen maar niets naar Telegram sturen"
        type: boolean
        default: false
      demo:
        description: "Testbericht met een verzonnen swell naar Telegram sturen"
        type: boolean
        default: false

permissions:
  contents: write           # nodig om state.json terug te committen

concurrency:
  group: surf-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Draai de check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          python main.py --verbose \
            ${{ inputs.dry_run && '--dry-run' || '' }} \
            ${{ inputs.demo && '--demo' || '' }}

      - name: Onthouden wat gemeld is
        if: ${{ !inputs.dry_run }}
        run: |
          if [[ -n "$(git status --porcelain state.json)" ]]; then
            git config user.name  "surf-check"
            git config user.email "actions@users.noreply.github.com"
            git add state.json
            git commit -m "state: swell gemeld [skip ci]"
            git push
          else
            echo "Niets veranderd aan state.json"
          fi
